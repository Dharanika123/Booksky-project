<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOKSKY</title>
    <link rel="stylesheet" href="style.css">
 </head>   
<body>
   <div class="navbar">
      <h1 >BookSky</h1>
   </div> 
   <div class="container">
    <div class="book-container">
        <h1>Rich dad Poor dad</h1>
        <h4>Robert</h4>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. 
            Quasi voluptate eum provident neque omnis aspernatur deleniti culpa ratione reprehenderit et molestias possimus quibusdam repudiandae itaque, 
            assumenda quidem. Aspernatur, fuga optio.</p>
           <button onclick="del(event)">Delete</button>  
    </div>
   </div>
   <div class="popup-overlay">

   </div>
   <div class="popup-box">
    <h2>Add Book</h2>
    <form>
        <input type="text" id="title" placeholder="Book Title">
        <input type="text" placeholder="Book Author" id="book-author">
        <textarea placeholder="Short Description" id="description"></textarea>
        <button id="add-book">Add</button>
        <button id="cancel-popup">Cancel</button>
    </form>
   </div>
    
   <button class="add-button" id="add-popup-button" >+</button>
</body>
<script src="script.js"></script>
</html>
